<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>点対称ポリオミノの引き算</title>
  <link rel="icon" type="image/png" href="./images/favicon.png?2023.10.27">
  <link rel="apple-touch-icon" sizes="152x152" href="./images/apple-touch-icon.png?2023.10.27">
  <link rel="stylesheet" href="./css/main.css">
  <script src="./src/main.js" defer></script>
</head>
<body>
  <main id="contents">
    <header>
      <h1>点対称連結ポリオミノ同士の引き算</h1>
      <p id="version-info"></p>
    </header>
    <div id="size-info">
      <div>
        <label>横 <input type="number" id="width-val" min="1"></label>
        <label>縦 <input type="number" id="height-val" min="1"></label>
      </div>
      <fieldset id="mode-picker" aria-label="操作モード">
        <label><input type="radio" name="mode" value="size"><span>サイズ変更<wbr>モード</span></label>
        <label><input type="radio" name="mode" value="normal" checked><span>描画<wbr>モード</span></label>
        <label><input type="radio" name="mode" value="inspect" id="inspect-mode"><span>解の確認<wbr>モード</span></label>
      </fieldset>
    </div>
    <p id="size-warning" role="status"></p>
    <p id="process-time-info"></p>
    <svg id="svg-board" aria-label="ポリオミノの盤面"></svg>
    <p><a id="url-info">現在の盤面のURL</a></p>
    <section>
      <h2 id="mode-name-info">モード</h2>
      <p id="mode-info"></p>
    </section>
    <footer>@tatt61880</footer>
  </main>
</body>
</html>
